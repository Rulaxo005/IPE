<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 0 1051 286" width="1051" height="286" role="img" aria-label="Actividades de Monadelphous"><rect width="1040" height="286" fill="none"/><text x="0" y="13" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#5A5A54">ACTIVIDADES DE MONADELPHOUS</text><line x1="0" y1="23" x2="1040" y2="23" stroke="#E3E1DB" stroke-width="1"/><rect x="0" y="40" width="1040" height="34" rx="2" fill="#F2F0EB" stroke="#CFCCC4" stroke-width="1" /><text x="14" y="62" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#5A5A54" text-anchor="start" letter-spacing="0" opacity="1">La mina de hierro o la planta de gas son propiedad del cliente. Monadelphous entra a trabajar dentro.</text><rect x="0.0" y="98" width="336.6666666666667" height="146" rx="2" fill="#FFFDF9" stroke="#E3E1DB" stroke-width="1" /><rect x="0.0" y="98" width="336.6666666666667" height="3" rx="0" fill="#B5432C" stroke="none" stroke-width="1" /><text x="14.0" y="124" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#8A8A82" text-anchor="start" letter-spacing="0" opacity="1">01</text><text x="14.0" y="146" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#B5432C" text-anchor="start" letter-spacing="0.7" opacity="1">CONSTRUIR</text><text x="14.0" y="166" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C1A" text-anchor="start" letter-spacing="0" opacity="1">Monta la instalación nueva</text><line x1="14.0" y1="180" x2="322.6666666666667" y2="180" stroke="#E3E1DB" stroke-width="1"/><text x="14.0" y="196" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#5A5A54" text-anchor="start" letter-spacing="1.1" opacity="1">EQUIPOS E INSTALACIONES</text><text x="14.0" y="212" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="10.8" font-weight="400" fill="#5A5A54" text-anchor="start" letter-spacing="0" opacity="1">Estructuras, tuberías, cintas transportadoras,</text><text x="14.0" y="225" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="10.8" font-weight="400" fill="#5A5A54" text-anchor="start" letter-spacing="0" opacity="1">tanques</text><rect x="350.6666666666667" y="98" width="336.6666666666667" height="146" rx="2" fill="#FFFDF9" stroke="#E3E1DB" stroke-width="1" /><rect x="350.6666666666667" y="98" width="336.6666666666667" height="3" rx="0" fill="#B5432C" stroke="none" stroke-width="1" /><text x="364.6666666666667" y="124" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#8A8A82" text-anchor="start" letter-spacing="0" opacity="1">02</text><text x="364.6666666666667" y="146" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#B5432C" text-anchor="start" letter-spacing="0.7" opacity="1">MANTENER</text><text x="364.6666666666667" y="166" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C1A" text-anchor="start" letter-spacing="0" opacity="1">Personal fijo dentro del recinto</text><line x1="364.6666666666667" y1="180" x2="673.3333333333334" y2="180" stroke="#E3E1DB" stroke-width="1"/><text x="364.6666666666667" y="196" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#5A5A54" text-anchor="start" letter-spacing="1.1" opacity="1">EQUIPOS E INSTALACIONES</text><text x="364.6666666666667" y="212" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="10.8" font-weight="400" fill="#5A5A54" text-anchor="start" letter-spacing="0" opacity="1">Bombas, motores, reductoras, cintas, válvulas</text><rect x="701.3333333333334" y="98" width="336.6666666666667" height="146" rx="2" fill="#FFFDF9" stroke="#E3E1DB" stroke-width="1" /><rect x="701.3333333333334" y="98" width="336.6666666666667" height="3" rx="0" fill="#B5432C" stroke="none" stroke-width="1" /><text x="715.3333333333334" y="124" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#8A8A82" text-anchor="start" letter-spacing="0" opacity="1">03</text><text x="715.3333333333334" y="146" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#B5432C" text-anchor="start" letter-spacing="0.7" opacity="1">REPARAR EN PARADA</text><text x="715.3333333333334" y="166" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C1A" text-anchor="start" letter-spacing="0" opacity="1">Trabaja en las paradas programadas</text><line x1="715.3333333333334" y1="180" x2="1024.0" y2="180" stroke="#E3E1DB" stroke-width="1"/><text x="715.3333333333334" y="196" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#5A5A54" text-anchor="start" letter-spacing="1.1" opacity="1">EQUIPOS E INSTALACIONES</text><text x="715.3333333333334" y="212" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="10.8" font-weight="400" fill="#5A5A54" text-anchor="start" letter-spacing="0" opacity="1">Sustitución de conjuntos completos,</text><text x="715.3333333333334" y="225" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="10.8" font-weight="400" fill="#5A5A54" text-anchor="start" letter-spacing="0" opacity="1">alineaciones, soldadura</text><text x="0" y="280" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#5A5A54" text-anchor="start" letter-spacing="0" opacity="1">Las tres actividades se hacen sobre instalación industrial ajena, y por eso el trabajo es de sector secundario.</text></svg>