ity="1">05</text><line x1="467.40000000000003" y1="44" x2="467.40000000000003" y2="160" stroke="#1C1C1A" stroke-width="1" stroke-dasharray="4 4"/><text x="459.40000000000003" y="154" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#5A5A54" text-anchor="end" letter-spacing="0" opacity="1">Reconocidos por el INE</text><text x="475.40000000000003" y="154" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#8A8A82" text-anchor="start" letter-spacing="0" opacity="1">No reconocidos: propuestas académicas</text><text x="0" y="192" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="12.5" fill="#5A5A54">El primario lo extrae, el secundario lo fabrica, el terciario lo vende o lo repara, el cuaternario lo diseña, el quinario lo decide.</text></svg>