<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 0 591 214" width="591" height="214" role="img" aria-label="Las dos distancias a la misma escala"><rect width="580" height="214" fill="none"/><text x="0" y="13" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#5A5A54">LAS DOS DISTANCIAS A LA MISMA ESCALA</text><line x1="0" y1="23" x2="580" y2="23" stroke="#E3E1DB" stroke-width="1"/><text x="0" y="42" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#5A5A54" text-anchor="start" letter-spacing="1.1" opacity="1">AUSTRALIA · DE PERTH A LAS MINAS DE PILBARA</text><line x1="0" y1="72" x2="376.25" y2="72" stroke="#B5432C" stroke-width="2.2"/><circle cx="0" cy="72" r="4.5" fill="#B5432C"/><text x="0" y="60" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11.5" font-weight="600" fill="#1C1C1A" text-anchor="start" letter-spacing="0" opacity="1">Perth</text><circle cx="376.25" cy="72" r="4.5" fill="#B5432C"/><text x="376.25" y="60" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11.5" font-weight="600" fill="#1C1C1A" text-anchor="end" letter-spacing="0" opacity="1">Minas de Pilbara</text><text x="388.25" y="77" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#B5432C" text-anchor="start" letter-spacing="0" opacity="1">≈ 1.400 km</text><text x="0" y="94" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#5A5A54" text-anchor="start" letter-spacing="0" opacity="1">Sin carretera útil para ir y volver a diario: se va en avión y se duerme allí.</text><text x="0" y="120" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#5A5A54" text-anchor="start" letter-spacing="1.1" opacity="1">LA MISMA DISTANCIA, MEDIDA DESDE MADRID</text><line x1="0" y1="148" x2="366.84375" y2="148" stroke="#14549B" stroke-width="2.2"/><circle cx="0" cy="148" r="4.5" fill="#14549B"/><text x="0" y="136" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11.5" font-weight="600" fill="#1C1C1A" text-anchor="start" letter-spacing="0" opacity="1">Madrid</text><circle cx="366.84375" cy="148" r="4.5" fill="#14549B"/><text x="366.84375" y="136" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11.5" font-weight="600" fill="#1C1C1A" text-anchor="end" letter-spacing="0" opacity="1">Roma</text><text x="378.84375" y="153" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#14549B" text-anchor="start" letter-spacing="0" opacity="1">1.365 km</text><text x="0" y="170" font-family="Segoe UI,Inter,system-ui,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#5A5A54" text-anchor="start" letter-spacing="0" opacity="1">A esa distancia el desplazamiento diario es imposible: de ahí el sistema FIFO.</text><line x1="0" y1="190" x2="134.375" y2="190" stroke="#1C1C1A" stroke-width="1.4"/><line x1="0" y1="186" x2="0" y2="194" stroke="#1C1C1A" stroke-width="1.4"/><line x1="134.375" y1="186" x2="134.375" y2="194" stroke="#1C1C1A" stroke-width="1.4"/><text x="144.375" y="194" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="600" fill="#5A5A54" text-anchor="start" letter-spacing="0" opacity="1">500 km</text></svg>